# Публикация на GitHub Pages.
#
# Pages «из ветки» умеет отдавать только корень или /docs, а собранная
# страница лежит в dist/. Поэтому публикуем через Actions — каталог может
# быть любым.
#
# Один раз в настройках репозитория: Settings → Pages → Source → GitHub Actions.
# Публикуется ветка по умолчанию.
name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Публикуем только ветку по умолчанию — как бы она ни называлась: сейчас это
    # рабочая ветка, после слияния станет main, и правки workflow не потребуется.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
